
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f2edf7">
<title>ハーブとオーラの診断</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: sans-serif;
  color: #354438;
  background: linear-gradient(150deg,#f4f6ed,#eee5f5,#fdf1e8);
}
main { max-width: 560px; margin: auto; padding: 20px 16px 40px; }
header { text-align: center; padding: 20px 8px; }
h1 { font-size: 27px; line-height: 1.5; }
h2 { font-size: 19px; }
.sub { color: #69766a; line-height: 1.7; }
.card {
  background: #ffffffed;
  border-radius: 20px;
  padding: 20px;
  margin: 16px 0;
  box-shadow: 0 5px 24px #35443812;
}
label.option {
  display: block;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #dce5d8;
  border-radius: 12px;
  cursor: pointer;
}
input[type=radio] { margin-right: 8px; }
button, .upload {
  display: block;
  width: 100%;
  border: 0;
  border-radius: 13px;
  padding: 14px;
  background: #547b5c;
  color: white;
  font-size: 16px;
  text-align: center;
  cursor: pointer;
}
.upload { background: #76649a; margin: 12px 0; }
#photoInput { display: none; }
.photo-stage {
  position: relative;
  width: min(100%, 310px);
  aspect-ratio: 3 / 4;
  margin: 20px auto;
  display: flex;
  justify-content: center;
  align-items: center;
  isolation: isolate;
}
.photo-stage::before {
  content: "";
  position: absolute;
  inset: -12px;
  border-radius: 48%;
  background: var(--aura, radial-gradient(circle,#fff2b5,#b9a6e8,#8296cb));
  filter: blur(25px);
  opacity: .85;
  z-index: -1;
  animation: glow 3s ease-in-out infinite alternate;
}
@keyframes glow {
  from { transform: scale(.94); opacity: .6; }
  to { transform: scale(1.06); opacity: .95; }
}
#portrait {
  display: none;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 46% 46% 25% 25%;
  border: 3px solid #ffffffd9;
  box-shadow: 0 0 25px #bba7e9a8;
}
.photo-placeholder {
  text-align: center;
  padding: 24px;
  color: #5e536e;
  line-height: 1.8;
}
#result { display: none; }
.herb {
  background: #f3f7ef;
  padding: 14px;
  border-radius: 12px;
  margin: 10px 0;
  line-height: 1.7;
}
.small { font-size: 12px; line-height: 1.7; color: #687468; }
</style>
</head>
<body>
<main>
<header>
  <div style="font-size:40px">🌿 ✨ 🌿</div>
  <h1>ハーブとオーラの診断</h1>
  <p class="sub">あなたの写真に、今日のオーラの彩りを。</p>
</header>

<section class="card">
  <h2>📷 あなたの写真</h2>
  <p class="sub">顔写真を選ぶと、写真の周りに光の演出が現れます。</p>
  <label class="upload" for="photoInput">写真を選ぶ・撮影する</label>
  <input id="photoInput" type="file" accept="image/*">
  <div class="photo-stage" id="photoStage">
    <div class="photo-placeholder" id="placeholder">
      <div style="font-size:50px">🌸</div>
      ここに写真が表示されます
    </div>
    <img id="portrait" alt="選択した写真">
  </div>
  <p class="small">写真はこの画面内で処理し、外部サーバーには送信しません。診断後も写真は保存されません。</p>
</section>

<section class="card">
  <h2>🌼 今の気分は？</h2>
  <label class="option"><input type="radio" name="mood" value="calm" checked> ゆっくり休みたい</label>
  <label class="option"><input type="radio" name="mood" value="energy"> 元気を出したい</label>
  <label class="option"><input type="radio" name="mood" value="refresh"> 気分をすっきりさせたい</label>
  <label class="option"><input type="radio" name="mood" value="happy"> 明るい気持ちになりたい</label>

  <h2>🍃 今、求めていることは？</h2>
  <label class="option"><input type="radio" name="wish" value="rest" checked> 休息とリラックス</label>
  <label class="option"><input type="radio" name="wish" value="focus"> 集中と気分転換</label>
  <label class="option"><input type="radio" name="wish" value="nature"> 自然とのつながり</label>

  <button onclick="diagnose()">私に合うハーブを診断する ✨</button>
</section>

<section class="card" id="result">
  <h2 style="text-align:center">✨ あなたの今日のオーラ</h2>
  <p id="auraText" style="text-align:center;line-height:1.8"></p>
  <h2>🌿 おすすめハーブ BEST 3</h2>
  <div id="herbs"></div>
  <button onclick="saveDiagnosisCard()" style="margin:16px 0;background:#79639b;">
  🌿 診断カードを作成・画像保存
</button>
  <p class="small">この診断は気分や好みに基づく娯楽・学習用のコンテンツです。オーラを科学的に測定するものではありません。</p>
  <button onclick="diagnose()">もう一度診断する</button>
</section>
</main>

<script>
const herbData = {
  lavender: ["ラベンダー","💜","香りをゆっくり楽しみ、くつろぎの時間を作りたいときに。"],
  rosemary: ["ローズマリー","🌿","すがすがしい香りで気分を切り替えたいときに。"],
  peppermint: ["ペパーミント","🍃","清涼感のある香りでリフレッシュしたいときに。"],
  chamomile: ["カモミール","🌼","花の香りとともに穏やかな時間を楽しみたいときに。"],
  lemonbalm: ["レモンバーム","🍋","レモンのような香りで心地よいひとときを。"],
  lemongrass: ["レモングラス","🌾","明るく爽やかな香りで気分転換したいときに。"],
  calendula: ["カレンデュラ","🌻","鮮やかな花を眺めて植物の彩りを楽しみたいときに。"]
};

const moods = {
  calm: {
    ids: ["lavender","chamomile","lemonbalm"],
    color: "radial-gradient(circle,#fff7df,#c5b1e8,#8b83bc)",
    text: "ラベンダー色のイメージ 🌙 自分をいたわる時間を大切に。"
  },
  energy: {
    ids: ["rosemary","lemongrass","calendula"],
    color: "radial-gradient(circle,#fff8b5,#f1b85e,#d77f68)",
    text: "あたたかな金色のイメージ ☀️ 小さな一歩から始めましょう。"
  },
  refresh: {
    ids: ["peppermint","lemongrass","rosemary"],
    color: "radial-gradient(circle,#e2fff2,#82d8b5,#5999b4)",
    text: "若葉色のイメージ 🍃 深呼吸して気分を切り替えて。"
  },
  happy: {
    ids: ["calendula","lemonbalm","chamomile"],
    color: "radial-gradient(circle,#fff8c5,#f3bd72,#ed8e9b)",
    text: "陽だまり色のイメージ 🌼 好きなものに目を向けて。"
  }
};

document.getElementById("photoInput").addEventListener("change", function() {
  const file = this.files && this.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("画像ファイルを選んでください。");
    return;
  }

  const reader = new FileReader();
  reader.onload = function(event) {
    const img = document.getElementById("portrait");
    img.src = event.target.result;
    img.style.display = "block";
    document.getElementById("placeholder").style.display = "none";
  };
  reader.readAsDataURL(file);
});

function diagnose() {
  const mood = document.querySelector('input[name="mood"]:checked').value;
  const wish = document.querySelector('input[name="wish"]:checked').value;
  const chosen = moods[mood];
  let ids = [...chosen.ids];

  if (wish === "rest") {
    ids = ["chamomile","lavender","lemonbalm"];
  } else if (wish === "focus") {
    ids = ["rosemary","peppermint","lemongrass"];
  }

  document.getElementById("photoStage").style.setProperty("--aura", chosen.color);
  document.getElementById("auraText").textContent = chosen.text;

  document.getElementById("herbs").replaceChildren();
  ids.forEach((id, i) => {
    const h = herbData[id];
    const item = document.createElement("div");
    item.className = "herb";

    const title = document.createElement("strong");
    title.textContent = (i + 1) + "位 " + h[1] + " " + h[0];

    const desc = document.createElement("p");
    desc.textContent = h[2];

    item.append(title, desc);
    document.getElementById("herbs").appendChild(item);
  });

  document.getElementById("result").style.display = "block";
  document.getElementById("result").scrollIntoView({behavior:"smooth"});
}

function saveDiagnosisCard() {
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = 1000;
  canvas.height = 1400;

  // 背景
  const bg = ctx.createLinearGradient(0, 0, 1000, 1400);
  bg.addColorStop(0, "#f3e9ff");
  bg.addColorStop(0.5, "#fffaf0");
  bg.addColorStop(1, "#e1f3e5");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 1000, 1400);

  // タイトル
  ctx.fillStyle = "#514267";
  ctx.textAlign = "center";
  ctx.font = "bold 52px sans-serif";
  ctx.fillText("MY HERB AURA", 500, 85);
  ctx.font = "30px sans-serif";
  ctx.fillText("わたしのオーラとハーブ診断", 500, 135);

  // 顔写真
  const portrait = document.getElementById("portrait");
  if (portrait && portrait.src && portrait.naturalWidth > 0) {
    const x = 250, y = 175, w = 500, h = 500;
    const scale = Math.max(w / portrait.naturalWidth, h / portrait.naturalHeight);
    const sw = w / scale;
    const sh = h / scale;
    const sx = (portrait.naturalWidth - sw) / 2;
    const sy = (portrait.naturalHeight - sh) / 2;

    ctx.save();
    ctx.beginPath();
    ctx.arc(500, 425, 250, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(portrait, sx, sy, sw, sh, x, y, w, h);
    ctx.restore();
  } else {
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(500, 425, 200, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#79639b";
    ctx.font = "32px sans-serif";
    ctx.fillText("顔写真を登録してください", 500, 435);
  }

  // オーラ診断結果
  const aura = document.getElementById("auraText");
  const auraText = aura ? aura.innerText.trim() : "";
  ctx.fillStyle = "#514267";
  ctx.font = "bold 36px sans-serif";
  ctx.fillText("あなたのオーラ診断", 500, 745);

  ctx.font = "28px sans-serif";
  const words = ctx.measureText(auraText).width;
  if (words > 880) {
    const chars = Math.max(10, Math.floor(auraText.length * 880 / words));
    ctx.fillText(auraText.slice(0, chars), 500, 800);
    ctx.fillText(auraText.slice(chars), 500, 840);
  } else {
    ctx.fillText(auraText || "診断結果", 500, 805);
  }

  // おすすめハーブ BEST 3
  ctx.font = "bold 38px sans-serif";
  ctx.fillText("おすすめハーブ BEST 3", 500, 900);

  const herbs = document.getElementById("herbs");
  const items = herbs ? Array.from(herbs.children).slice(0, 3) : [];

  ctx.textAlign = "left";
  ctx.font = "30px sans-serif";
  let y = 965;

  items.forEach((item, index) => {
    const lines = item.innerText.trim().split("\n");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(65, y - 38, 870, 115);

    ctx.fillStyle = "#514267";
    ctx.font = "bold 30px sans-serif";
    ctx.fillText(lines[0] || `${index + 1}位`, 90, y);

    ctx.font = "23px sans-serif";
    const description = lines.slice(1).join(" ").trim();
    const maxChars = 46;
    ctx.fillText(description.slice(0, maxChars), 90, y + 38);
    if (description.length > maxChars) {
      ctx.fillText(description.slice(maxChars, maxChars * 2), 90, y + 68);
    }
    y += 130;
  });

  // 保存用の画像を開く
  const imageURL = canvas.toDataURL("image/png");
  const newWindow = window.open(imageURL, "_blank");

  if (!newWindow) {
    alert("画像を開けませんでした。Safariのポップアップ設定をご確認ください。");
  }
}

</script>
</body>
</html>
